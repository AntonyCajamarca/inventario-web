<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categorías — Bazar y Papelería Keylita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/main.css" rel="stylesheet" />
</head>
<body>

  <main class="app-main">
    <div id="alertBox"></div>

    <div class="row g-3">
      <div class="col-lg-4">
        <div class="panel-box">
          <div class="panel-title" id="formTitulo"><i class="bi bi-tag-fill me-1"></i>Nueva categoría</div>

          <div id="formAlertBox"></div>

          <form id="formCategoria">
            <input type="hidden" id="categoriaId" />
            <div class="mb-3">
              <label class="form-label" for="categoriaNombre">Nombre</label>
              <input type="text" class="form-control" id="categoriaNombre" required minlength="2" placeholder="Ej: Papelería" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="categoriaDescripcion">Descripción (opcional)</label>
              <textarea class="form-control" id="categoriaDescripcion" rows="3" placeholder="Descripción breve..."></textarea>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary flex-fill" id="btnGuardarCategoria">
                <i class="bi bi-check-lg me-1"></i>Guardar
              </button>
              <button type="button" class="btn btn-light d-none" id="btnCancelarEdicion">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="panel-box">
          <div class="panel-title"><i class="bi bi-list-ul me-1"></i>Categorías registradas</div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Descripción</th>
                  <th class="text-center">Productos</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaCategorias"></tbody>
            </table>
          </div>
          <div id="categoriasVacio" class="empty-state d-none">
            <i class="bi bi-tags fs-2 d-block mb-2"></i>
            Todavía no hay categorías. Crea la primera con el formulario de la izquierda.
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/components/layout.js"></script>
  <script>
    renderLayout("categorias", "Categorías");
  </script>
  <script src="/js/categorias.js"></script>
</body>
</html>
