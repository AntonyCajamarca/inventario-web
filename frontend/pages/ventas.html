<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ventas — Bazar y Papelería Keylita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/main.css" rel="stylesheet" />
</head>
<body>

  <main class="app-main">
    <div id="alertBox"></div>

    <div class="row g-3">
      <!-- ============ Columna izquierda: catálogo de productos ============ -->
      <div class="col-lg-7">
        <div class="panel-box">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
            <div class="panel-title mb-0" style="border-bottom:none; padding-bottom:0;">
              <i class="bi bi-shop-window me-1"></i>Punto de venta
            </div>
            <div class="input-group input-group-sm" style="width: 260px;">
              <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control" id="inputBuscarProducto" placeholder="Buscar por nombre o código..." />
            </div>
          </div>

          <div class="table-responsive" style="max-height: 520px; overflow-y: auto;">
            <table class="table align-middle table-clickable">
              <thead>
                <tr>
                  <th></th>
                  <th>Producto</th>
                  <th class="text-end">Precio</th>
                  <th class="text-center">Stock</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tablaProductosVenta"></tbody>
            </table>
          </div>
          <div id="productosVentaVacio" class="empty-state d-none">
            <i class="bi bi-box fs-2 d-block mb-2"></i>
            No se encontraron productos.
          </div>
        </div>
      </div>

      <!-- ============ Columna derecha: carrito ============ -->
      <div class="col-lg-5">
        <div class="panel-box d-flex flex-column" style="min-height: 100%;">
          <div class="panel-title">
            <i class="bi bi-cart3 me-1"></i>Carrito
          </div>

          <div id="carritoAlertBox"></div>

          <div class="table-responsive flex-grow-1" style="max-height: 380px; overflow-y: auto;">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th class="text-center" style="width: 100px;">Cant.</th>
                  <th class="text-end">Subtotal</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tablaCarrito"></tbody>
            </table>
          </div>
          <div id="carritoVacio" class="empty-state py-4">
            <i class="bi bi-cart-x fs-2 d-block mb-2"></i>
            Aún no has agregado productos.
          </div>

          <div class="d-flex align-items-center justify-content-between mt-3 pt-3" style="border-top: 2px solid var(--accent);">
            <span class="fw-semibold text-muted">Total</span>
            <span id="carritoTotal" style="font-size: 1.5rem; font-weight: 700;">$0.00</span>
          </div>

          <button type="button" class="btn btn-primary w-100 mt-3" id="btnRegistrarVenta" disabled>
            <i class="bi bi-check-circle me-1"></i>Registrar venta
          </button>
          <button type="button" class="btn btn-light w-100 mt-2" id="btnVaciarCarrito">
            Vaciar carrito
          </button>
        </div>
      </div>
    </div>

    <!-- ============ Historial de ventas ============ -->
    <div class="panel-box mt-3">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div class="panel-title mb-0" style="border-bottom:none; padding-bottom:0;">
          <i class="bi bi-clock-history me-1"></i>Historial de ventas
        </div>
        <div class="d-flex flex-wrap gap-2">
          <input type="date" class="form-control form-control-sm" id="filtroFecha" style="width: 160px;" />
          <input type="text" class="form-control form-control-sm" id="filtroProducto" placeholder="Producto..." style="width: 160px;" />
          <input type="number" min="1" class="form-control form-control-sm" id="filtroNumeroVenta" placeholder="N° venta" style="width: 110px;" />
          <button class="btn btn-sm btn-primary" id="btnFiltrarVentas"><i class="bi bi-funnel me-1"></i>Filtrar</button>
          <button class="btn btn-sm btn-light" id="btnLimpiarFiltros">Limpiar</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle table-clickable">
          <thead>
            <tr>
              <th>N° venta</th>
              <th>Fecha</th>
              <th>Vendedor</th>
              <th>Productos</th>
              <th class="text-center">Items</th>
              <th class="text-end">Total</th>
            </tr>
          </thead>
          <tbody id="tablaHistorialVentas"></tbody>
        </table>
      </div>
      <div id="historialVacio" class="empty-state d-none">
        <i class="bi bi-receipt fs-2 d-block mb-2"></i>
        No se encontraron ventas con esos filtros.
      </div>
    </div>
  </main>

  <!-- Modal detalle / confirmación de venta -->
  <div class="modal fade" id="modalDetalleVenta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalDetalleVentaTitulo">Venta</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex justify-content-between text-muted mb-2" style="font-size:0.85rem;">
            <span id="detalleVentaFecha"></span>
            <span id="detalleVentaVendedor"></span>
          </div>
          <table class="table table-sm align-middle">
            <thead>
              <tr>
                <th>Producto</th>
                <th class="text-center">Cant.</th>
                <th class="text-end">P. unit.</th>
                <th class="text-end">Subtotal</th>
              </tr>
            </thead>
            <tbody id="detalleVentaTabla"></tbody>
          </table>
          <div class="d-flex align-items-center justify-content-between pt-2" style="border-top: 2px solid var(--accent);">
            <span class="fw-semibold text-muted">Total</span>
            <span id="detalleVentaTotal" style="font-size: 1.25rem; font-weight: 700;"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/components/layout.js"></script>
  <script>
    renderLayout("ventas", "Ventas");
  </script>
  <script src="/js/ventas.js"></script>
</body>
</html>
