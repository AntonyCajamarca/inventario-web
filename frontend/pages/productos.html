<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos — Bazar y Papelería Keylita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/main.css" rel="stylesheet" />
</head>
<body>

  <main class="app-main">
    <div id="alertBox"></div>

    <div class="panel-box">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div class="panel-title mb-0" style="border-bottom:none; padding-bottom:0;">
          <i class="bi bi-box-seam-fill me-1"></i>Productos
        </div>
        <div class="d-flex gap-2">
          <div class="input-group input-group-sm" style="width: 260px;">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="inputBuscar" placeholder="Buscar por nombre o código..." />
          </div>
          <button class="btn btn-primary btn-sm text-nowrap" id="btnNuevoProducto">
            <i class="bi bi-plus-lg me-1"></i>Nuevo producto
          </button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th></th>
              <th>Código</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th class="text-end">Precio</th>
              <th class="text-center">Stock</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductos"></tbody>
        </table>
      </div>
      <div id="productosVacio" class="empty-state d-none">
        <i class="bi bi-box fs-2 d-block mb-2"></i>
        No se encontraron productos.
      </div>
    </div>
  </main>

  <!-- Modal crear/editar producto -->
  <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formProducto">
          <div class="modal-header">
            <h5 class="modal-title" id="modalProductoTitulo">Nuevo producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="modalProductoAlertBox"></div>
            <input type="hidden" id="productoId" />

            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label" for="productoCodigo">Código</label>
                <input type="text" class="form-control" id="productoCodigo" required />
              </div>
              <div class="col-6 mb-3">
                <label class="form-label" for="productoCategoria">Categoría</label>
                <select class="form-select" id="productoCategoria" required></select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="productoNombre">Nombre</label>
              <input type="text" class="form-control" id="productoNombre" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="productoDescripcion">Descripción (opcional)</label>
              <textarea class="form-control" id="productoDescripcion" rows="2"></textarea>
            </div>

            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label" for="productoPrecio">Precio</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input type="number" step="0.01" min="0.01" class="form-control" id="productoPrecio" required />
                </div>
              </div>
              <div class="col-6 mb-3">
                <label class="form-label" for="productoStock">Stock</label>
                <input type="number" step="1" min="0" class="form-control" id="productoStock" required />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="btnGuardarProducto">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal imagen del producto -->
  <div class="modal fade" id="modalImagen" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Imagen del producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <div id="modalImagenAlertBox"></div>
          <img id="imagenPreview" src="" alt="Vista previa"
               class="img-thumbnail mb-3 d-none"
               style="max-height: 220px; object-fit: contain;" />
          <div id="imagenPlaceholder" class="empty-state py-4">
            <i class="bi bi-image fs-1 d-block mb-2"></i>
            Este producto no tiene imagen todavía.
          </div>

          <input type="file" class="form-control mb-3" id="inputImagen" accept=".jpg,.jpeg,.png,.gif" />

          <div class="d-flex gap-2 justify-content-center">
            <button type="button" class="btn btn-primary" id="btnSubirImagen">
              <i class="bi bi-upload me-1"></i>Subir imagen
            </button>
            <button type="button" class="btn btn-outline-danger d-none" id="btnEliminarImagen">
              <i class="bi bi-trash me-1"></i>Quitar imagen
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/components/layout.js"></script>
  <script>
    renderLayout("productos", "Productos");
  </script>
  <script src="/js/productos.js"></script>
</body>
</html>
