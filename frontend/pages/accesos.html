<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accesos — Bazar y Papelería Keylita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/main.css" rel="stylesheet" />
</head>
<body>

  <main class="app-main">
    <div id="alertBox"></div>

    <div class="panel-box">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <div class="panel-title mb-0" style="border-bottom:none; padding-bottom:0;">
          <i class="bi bi-people-fill me-1"></i>Usuarios del sistema
        </div>
        <button class="btn btn-primary btn-sm" id="btnNuevoUsuario">
          <i class="bi bi-plus-lg me-1"></i>Nuevo usuario
        </button>
      </div>

      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Nivel</th>
              <th>Estado</th>
              <th>Último acceso</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaUsuarios"></tbody>
        </table>
      </div>
      <div id="usuariosVacio" class="empty-state d-none">
        <i class="bi bi-person-x fs-2 d-block mb-2"></i>
        No hay usuarios registrados.
      </div>
    </div>
  </main>

  <!-- Modal crear/editar usuario -->
  <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formUsuario">
          <div class="modal-header">
            <h5 class="modal-title" id="modalUsuarioTitulo">Nuevo usuario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="modalAlertBox"></div>
            <input type="hidden" id="usuarioId" />

            <div class="mb-3">
              <label class="form-label" for="usuarioNombre">Nombre completo</label>
              <input type="text" class="form-control" id="usuarioNombre" required minlength="2" />
            </div>

            <div class="mb-3">
              <label class="form-label" for="usuarioEmail">Correo electrónico</label>
              <input type="email" class="form-control" id="usuarioEmail" required placeholder="nombre@keylita.com" />
              <div class="form-text">El correo no se puede modificar después de creado.</div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="usuarioPassword">Contraseña</label>
              <input type="password" class="form-control" id="usuarioPassword" minlength="8" />
              <div class="form-text" id="passwordHint">Mínimo 8 caracteres.</div>
            </div>

            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label" for="usuarioNivel">Nivel</label>
                <select class="form-select" id="usuarioNivel">
                  <option value="vendedor">Vendedor</option>
                  <option value="admin">Administrador</option>
                </select>
              </div>
              <div class="col-6 mb-3 d-none" id="campoEstado">
                <label class="form-label" for="usuarioEstado">Estado</label>
                <select class="form-select" id="usuarioEstado">
                  <option value="activo">Activo</option>
                  <option value="inactivo">Inactivo</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="btnGuardarUsuario">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/components/layout.js"></script>
  <script>
    renderLayout("accesos", "Accesos");
    if (!Auth.isAdmin()) {
      window.location.href = "/pages/dashboard.html";
    }
  </script>
  <script src="/js/accesos.js"></script>
</body>
</html>
