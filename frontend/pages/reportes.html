<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reportes — Bazar y Papelería Keylita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/main.css" rel="stylesheet" />
</head>
<body>

  <main class="app-main">
    <div id="alertBox"></div>

    <div class="panel-box">
      <div class="panel-title mb-3"><i class="bi bi-graph-up-arrow me-1"></i>Reportes</div>

      <!-- Pestañas por tipo de reporte -->
      <ul class="nav nav-pills mb-3 flex-wrap" id="tabsReportes">
        <li class="nav-item">
          <button type="button" class="nav-link active" data-tipo="ventas-dia">
            <i class="bi bi-calendar-day me-1"></i>Ventas del día
          </button>
        </li>
        <li class="nav-item">
          <button type="button" class="nav-link" data-tipo="ventas-rango">
            <i class="bi bi-calendar-range me-1"></i>Ventas por fecha
          </button>
        </li>
        <li class="nav-item">
          <button type="button" class="nav-link" data-tipo="ventas-mensuales">
            <i class="bi bi-calendar3 me-1"></i>Ventas mensuales
          </button>
        </li>
        <li class="nav-item">
          <button type="button" class="nav-link" data-tipo="stock-bajo">
            <i class="bi bi-exclamation-triangle me-1"></i>Stock bajo
          </button>
        </li>
        <li class="nav-item">
          <button type="button" class="nav-link" data-tipo="mas-vendidos">
            <i class="bi bi-trophy me-1"></i>Más vendidos
          </button>
        </li>
      </ul>

      <div id="reporteAlertBox"></div>

      <!-- Filtros (solo se muestra el grupo del tipo activo) + acciones -->
      <div class="row g-2 align-items-end mb-3">
        <div class="col-auto filtro-grupo" data-filtro="ventas-dia">
          <label class="form-label mb-0">Fecha</label>
          <input type="date" class="form-control form-control-sm" id="rvFecha" />
        </div>

        <div class="col-auto filtro-grupo d-none" data-filtro="ventas-rango">
          <label class="form-label mb-0">Desde</label>
          <input type="date" class="form-control form-control-sm" id="rvFechaInicio" />
        </div>
        <div class="col-auto filtro-grupo d-none" data-filtro="ventas-rango">
          <label class="form-label mb-0">Hasta</label>
          <input type="date" class="form-control form-control-sm" id="rvFechaFin" />
        </div>

        <div class="col-auto filtro-grupo d-none" data-filtro="ventas-mensuales">
          <label class="form-label mb-0">Mes</label>
          <input type="month" class="form-control form-control-sm" id="rvMes" />
        </div>

        <div class="col-auto filtro-grupo d-none" data-filtro="stock-bajo">
          <div class="form-text mb-0">
            Se listan los productos en o por debajo del umbral de stock bajo.
          </div>
        </div>

        <div class="col-auto filtro-grupo d-none" data-filtro="mas-vendidos">
          <label class="form-label mb-0">Cantidad a mostrar</label>
          <input type="number" min="1" max="100" value="10" class="form-control form-control-sm" id="rvLimite" style="width: 100px;" />
        </div>

        <div class="col-auto ms-md-auto d-flex gap-2">
          <button type="button" class="btn btn-primary btn-sm" id="btnGenerarReporte">
            <i class="bi bi-eye me-1"></i>Ver reporte
          </button>
          <button type="button" class="btn btn-outline-danger btn-sm" id="btnDescargarPdf">
            <i class="bi bi-file-earmark-pdf me-1"></i>PDF
          </button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btnDescargarImagen">
            <i class="bi bi-file-earmark-image me-1"></i>Imagen
          </button>
        </div>
      </div>

      <!-- Estado vacio -->
      <div id="reporteVacio" class="empty-state">
        <i class="bi bi-bar-chart-line fs-2 d-block mb-2"></i>
        Elige los filtros y presiona "Ver reporte" para mostrar los datos.
      </div>

      <!-- Contenido del reporte -->
      <div id="reporteContenido" class="d-none">
        <h5 id="reporteTitulo" class="mb-1"></h5>
        <p class="text-muted mb-3" id="reporteMeta"></p>

        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr id="reporteHeaders"></tr>
            </thead>
            <tbody id="reporteFilas"></tbody>
          </table>
        </div>

        <div id="reporteTotalWrap" class="text-end d-none pt-2" style="border-top: 2px solid var(--accent);">
          <h5 id="reporteTotalLine" class="mb-0"></h5>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/components/layout.js"></script>
  <script>
    renderLayout("reportes", "Reportes");
  </script>
  <script src="/js/reportes.js"></script>
</body>
</html>
