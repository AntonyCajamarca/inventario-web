<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Bazar y Papelería Keylita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/main.css" rel="stylesheet" />
</head>
<body>

  <div class="login-shell">
    <div class="login-brand-panel">
      <div class="brand"><i class="bi bi-shop"></i> Bazar y Papelería <span>Keylita</span></div>
      <div>
        <h1>Controla tu inventario y tus ventas en un solo lugar.</h1>
        <p>Productos, stock, categorías, ventas y reportes — todo organizado y actualizado en tiempo real.</p>
      </div>
      <p style="font-size: 0.8rem; opacity: 0.6;">© <span id="year"></span> Bazar y Papelería Keylita</p>
    </div>

    <div class="login-form-panel">
      <div class="login-card">
        <h2 class="mb-1" style="font-weight:700;">Iniciar sesión</h2>
        <p class="text-muted mb-4">Ingresa con la cuenta que te asignó tu administrador.</p>

        <div id="alertBox"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="nombre@keylita.com" required />
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Contraseña</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" placeholder="••••••••" minlength="8" required />
              <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
            <span id="loginBtnText">Ingresar</span>
            <span id="loginBtnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
